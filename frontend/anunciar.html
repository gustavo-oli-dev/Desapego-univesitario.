<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="description" content="Anuncie um item para doação ou venda dentro do campus." />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2f6f4f" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/styles.css?v=100" />
</head>
<body>

  <header class="topbar topbar--app">
    <div class="topbar__inner">
      <div id="perfil-topo" class="perfil-topo"></div>
      <nav class="topbar__nav">
        <a href="index.html" class="btn btn--ghost">Home</a>
        <a href="catalogo.html" class="btn btn--ghost">Catálogo</a>
        <a href="meus-anuncios.html" class="btn btn--ghost">Meus anúncios</a>
        <a href="admin-denuncias.html" class="btn btn--ghost admin-link-denuncias" id="link-admin-denuncias" hidden>Denúncias</a>
        <a href="anunciar.html" class="btn btn--primary" aria-current="page">Anunciar item</a>
        <div class="topbar__extras">
          <button type="button" id="toggle-tema" class="tema-toggle" aria-label="Ativar modo noturno">🌙</button>
          <a href="termos.html" class="tema-toggle" aria-label="Termos de Uso" title="Termos de Uso"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></a>
        </div>
      </nav>
    </div>
  </header>

  <a href="index.html" class="logo-home" aria-label="Voltar para a Home" title="Início">
    <img src="img/mascote-badge.png" alt="Desapego Universitário" />
  </a>
  <a href="chat.html" class="chat-atalho chat-atalho--flutuante chat-notif-alvo" aria-label="Abrir o chat" title="Chat">
    <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
  </a>
  <button type="button" id="toggle-sidebar" class="sidebar-toggle" aria-label="Recolher menu">☰</button>

  <main>
    <section class="page-section">
      <div class="page-header">
        <h1>Anunciar item</h1>
        <p>Preencha os dados abaixo para publicar seu anúncio no catálogo.</p>
      </div>

      <div class="form-card">
        <form id="form-anuncio" class="form" novalidate>
          <label>
            Título
            <input type="text" name="titulo" id="f-titulo" placeholder="Ex: Calculadora científica HP" required maxlength="60" />
          </label>

          <label>
            Descrição
            <textarea name="descricao" id="f-descricao" placeholder="Conte o estado do item, detalhes que ajudam quem for buscar" maxlength="300"></textarea>
          </label>

          <label>
            Categoria
            <select name="categoria" id="f-categoria" required></select>
          </label>

          <div id="campos-livro" class="campos-extra" hidden>
            <div class="campo-multiescolha" data-campo="curso">
              <span class="campo-multiescolha__label">Curso</span>
              <!-- Mesmo componente do filtro de Curso do catálogo (<details> com
                   altura limitada e scroll), adaptado pra multi-seleção: cada
                   item marcado fica destacado em verde, igual ao item ativo do
                   filtro — só que aqui pode marcar mais de um. -->
              <details class="lista-opcoes lista-opcoes--campo lista-opcoes--multi" id="curso-anuncio-dropdown">
                <summary class="lista-opcoes__botao" id="curso-anuncio-botao">
                  <span class="lista-opcoes__botao-texto">Selecionar...</span>
                  <button type="button" class="lista-opcoes__limpar" id="curso-anuncio-limpar" aria-label="Limpar curso selecionado" hidden>×</button>
                </summary>
                <div class="lista-opcoes__painel lista-opcoes__painel--multi">
                  <input type="search" class="lista-opcoes__busca" id="curso-anuncio-busca"
                         placeholder="Buscar curso..." autocomplete="off" aria-label="Buscar curso" />
                  <ul class="lista-opcoes__lista" id="curso-anuncio-lista" aria-label="Curso" aria-multiselectable="true"></ul>
                </div>
              </details>
            </div>
          </div>

          <fieldset class="tipo-anuncio">
            <legend>Tipo de anúncio</legend>
            <label class="radio">
              <input type="radio" name="tipo" value="doacao" checked />
              Doação
            </label>
            <label class="radio">
              <input type="radio" name="tipo" value="venda" />
              Venda
            </label>
          </fieldset>

          <label id="label-preco">
            Preço (R$)
            <input type="text" inputmode="decimal" name="preco" id="f-preco" placeholder="0,00" disabled />
          </label>

          <div class="campo-fotos">
            <span class="campo-fotos__titulo">Fotos do item (opcional, até 5)</span>
            <label class="btn btn--ghost btn--sm campo-fotos__botao">
              Escolher fotos
              <input type="file" name="imagens" id="f-imagem" accept="image/*" multiple hidden />
            </label>
          </div>
          <div class="preview-imagens" id="preview-imagens"></div>

          <label class="checkbox-linha">
            <input type="checkbox" name="telefonePublico" id="f-telefone-publico" />
            Deixar meu telefone público nesse anúncio (mostra um botão de WhatsApp pra quem visitar)
          </label>

          <div id="bloco-oferta" class="bloco-oferta" hidden>
            <a href="#" id="link-fazer-oferta" class="btn btn--ghost btn--block">Fazer oferta (baixar preço)</a>
            <p class="bloco-oferta__aviso" id="aviso-oferta" hidden></p>
          </div>

          <button type="submit" class="btn btn--primary btn--block">
            <span class="btn__label">Publicar anúncio</span>
            <span class="btn__spinner" hidden></span>
          </button>
          <p class="form-feedback" id="form-feedback" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

<script src="js/config.js?v=100"></script>

<script src="js/auth.js?v=100"></script>
  <script src="js/api.js?v=100"></script>
  <script src="js/site.js?v=100"></script>
  <script src="js/anunciar.js?v=100"></script>
</body>
</html>
