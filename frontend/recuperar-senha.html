<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Recuperar senha — Desapego Universitário</title>
  <meta name="description" content="Redefina a senha da sua conta no Desapego Universitário." />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2f6f4f" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="stylesheet" href="css/styles.css?v=69" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a href="index.html" class="btn btn--ghost">Home</a>
      <button type="button" id="toggle-tema" class="tema-toggle" aria-label="Ativar modo noturno">🌙</button>
      <a href="termos.html" class="tema-toggle" aria-label="Termos de Uso" title="Termos de Uso"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></a>
    </div>
  </header>

  <main>
    <section class="page-section">
      <div class="page-header page-header--central">
        <h1>Recuperar senha</h1>
        <p>Informe seu email pra receber um código de verificação.</p>
      </div>

      <div class="form-card form-card--central">
        <div id="passo-email" class="cadastro-passo">
          <form id="form-email" class="form" novalidate>
            <label>
              Email
              <input type="email" name="email" id="f-email" required />
            </label>

            <button type="submit" class="btn btn--primary btn--block">
              <span class="btn__label">Enviar código</span>
              <span class="btn__spinner" hidden></span>
            </button>
            <p class="form-feedback" id="form-feedback-email" role="status" aria-live="polite"></p>
          </form>

          <p class="form-rodape">Lembrou a senha? <a href="login.html">Entrar</a></p>
        </div>

        <!-- Envio de email de verdade ainda não existe no projeto, então o
             código simulado aparece na própria tela — ver comentário em
             backend/main.py. -->
        <div id="passo-redefinir" class="cadastro-passo" hidden>
          <p class="cadastro-passo__intro" id="aviso-codigo-recuperar"></p>
          <form id="form-redefinir" class="form" novalidate>
            <label>
              Código de verificação
              <input type="text" name="codigo" id="f-codigo" required maxlength="6" inputmode="numeric" placeholder="000000" />
            </label>
            <label>
              Nova senha
              <input type="password" name="senhaNova" id="f-senha-nova" required minlength="8" />
            </label>

            <button type="submit" class="btn btn--primary btn--block">
              <span class="btn__label">Redefinir senha</span>
              <span class="btn__spinner" hidden></span>
            </button>
            <p class="form-feedback" id="form-feedback-redefinir" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </main>

<script src="js/auth.js?v=69"></script>
  <script src="js/api.js?v=69"></script>
  <script src="js/site.js?v=69"></script>
  <script src="js/recuperar-senha.js?v=69"></script>
</body>
</html>
